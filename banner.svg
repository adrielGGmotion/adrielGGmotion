<svg width="1200" height="240" viewBox="0 0 1200 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#161b22"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#D97757;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#D97757;stop-opacity:0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="240" fill="url(#bg)" rx="12"/>

  <!-- Subtle grid texture -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="0.15" opacity="0.08"/>
  </pattern>
  <rect width="1200" height="240" fill="url(#grid)" rx="12"/>

  <!-- Left accent bar -->
  <rect x="60" y="60" width="3" height="120" fill="#D97757" opacity="0.9"/>

  <!-- Waveform bars (right side, decorative) -->
  <g opacity="0.15" fill="#D97757">
    <rect x="920" y="100" width="6" height="40" rx="3"/>
    <rect x="934" y="80" width="6" height="80" rx="3"/>
    <rect x="948" y="60" width="6" height="120" rx="3"/>
    <rect x="962" y="90" width="6" height="60" rx="3"/>
    <rect x="976" y="70" width="6" height="100" rx="3"/>
    <rect x="990" y="105" width="6" height="30" rx="3"/>
    <rect x="1004" y="75" width="6" height="90" rx="3"/>
    <rect x="1018" y="55" width="6" height="130" rx="3"/>
    <rect x="1032" y="85" width="6" height="70" rx="3"/>
    <rect x="1046" y="95" width="6" height="50" rx="3"/>
    <rect x="1060" y="65" width="6" height="110" rx="3"/>
    <rect x="1074" y="100" width="6" height="40" rx="3"/>
    <rect x="1088" y="80" width="6" height="80" rx="3"/>
    <rect x="1102" y="110" width="6" height="20" rx="3"/>
    <rect x="1116" y="70" width="6" height="100" rx="3"/>
  </g>

  <!-- Name: "adriel" white, "GGmotion" orange -->
  <text x="84" y="138" font-family="'Courier New', Courier, monospace" font-size="64" font-weight="700">
    <tspan fill="#ffffff">adriel</tspan><tspan fill="#D97757">GGmotion</tspan>
  </text>

  <!-- Divider line -->
  <rect x="84" y="155" width="500" height="1.5" fill="url(#lineGrad)"/>

  <!-- Subtitle -->
  <text x="84" y="182" font-family="'Courier New', Courier, monospace" font-size="16" fill="#8b949e" letter-spacing="2">FOSS contributor · he/him</text>
</svg>
