<svg width="100%" viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .line { opacity: 0; animation: fadein 0.1s forwards; }
      .l1  { animation-delay: 0.3s; }
      .l2  { animation-delay: 0.7s; }
      .l3  { animation-delay: 1.2s; }
      .l4  { animation-delay: 1.5s; }
      .l5  { animation-delay: 1.8s; }
      .l6  { animation-delay: 2.1s; }
      .l7  { animation-delay: 2.4s; }
      .l8  { animation-delay: 2.8s; }
      .l9  { animation-delay: 3.1s; }
      .l10 { animation-delay: 3.4s; }
      .l11 { animation-delay: 3.7s; }
      .l12 { animation-delay: 4.1s; }
      .ascii { opacity: 0; animation: fadein 1.2s forwards; animation-delay: 0.1s; }
      .cursor { animation: blink 1s step-end infinite; animation-delay: 4.4s; opacity: 0; }
      @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
      @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    </style>
  </defs>

